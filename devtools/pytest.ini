[pytest]
# 测试只从 backend/tests 收集；测试产生的临时交付物目录必须排除，
# 否则 pytest 会尝试进入它们并因权限问题中断整个收集过程。
testpaths = backend/tests
norecursedirs = .* _tmp_run _test_tmp build dist __pycache__ *.egg 资料 输出结果
# 关掉 pytest 的缓存插件：本机沙箱下它建不出 .pytest_cache，会在仓库根留下
# 一堆删不掉的 pytest-cache-files-XXXX 目录（权限拒绝），既脏又清不掉。
# 缓存对这套测试没有价值（无 --lf/--ff 用法），直接关掉。
addopts = -p no:cacheprovider
