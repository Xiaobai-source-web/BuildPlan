[pytest]
# 测试只从 backend/tests 收集。在 backend/ 目录下直接跑 `python -m pytest` 即可，
# 不需要 -c devtools/pytest.ini（devtools/pytest.ini 里的 testpaths 是相对 devtools 的，
# 从仓库根用 -c 指过去会把 devtools/ 自己当成测试目录收集，产生一堆莫名其妙的 ERROR）。
testpaths = tests
# 测试产生的临时交付物/计划目录必须排除，否则 pytest 会尝试进入它们并在
# 权限问题上中断整个收集过程（本机沙箱下会报 WinError 5 拒绝访问）。
norecursedirs = .* _tmp_run _test_tmp _pt_run build dist __pycache__ *.egg 资料 输出结果
# 缓存插件：原来用 `-p no:cacheprovider` 整个关掉，因为本机沙箱下 pytest 会在
# **仓库根**建 .pytest_cache，建不出时留下一堆删不掉的 pytest-cache-files-XXXX。
# 代价是 `--lf` / `--ff` / `--sw` 全部失效（增量重跑没了，只能每次全量）。
# 现在把缓存目录显式钉到 `_test_tmp/` 下（该目录已在 norecursedirs 里，
# 由 tests/conftest.py 用普通 mkdir 创建，沙箱下可写）——既恢复增量重跑，
# 又不再污染仓库根。
cache_dir = _test_tmp/.pytest_cache
